<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Inventario en Cero</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f9f8f5;
  --border:#e2e1db;--text:#1a1a19;--muted:#6b6a66;--subtle:#9b9a96;
  --blue:#2a78d6;--green:#1baf7a;--amber:#eda100;--red:#e24b4a;--purple:#534AB7;
  --shadow:0 2px 12px rgba(0,0,0,0.07),0 1px 3px rgba(0,0,0,0.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.06);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
.app-logo{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3rem}
.loading-card{background:var(--surface);border-radius:20px;padding:3rem 2.5rem;max-width:420px;width:100%;box-shadow:var(--shadow)}
.loading-icon{font-size:52px;margin-bottom:1rem}
.loading-card h1{font-size:20px;font-weight:600;margin-bottom:.5rem}
.loading-card p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:1rem}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{color:var(--red);font-size:13px;margin-top:1rem;padding:12px 16px;background:#fff5f5;border-radius:10px;border-left:3px solid var(--red);display:none;text-align:left}
.btn-retry{margin-top:1rem;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer}
#dashboard{display:none}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.topbar-brand{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-corte{font-size:13px;color:var(--muted)}
.topbar-corte span{font-weight:600;color:var(--text)}
.btn-refresh{display:flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .15s}
.btn-refresh:hover{opacity:.9}
.btn-refresh:disabled{opacity:.6;cursor:not-allowed}
.btn-refresh svg{width:14px;height:14px}
.btn-refresh.loading svg{animation:spin .7s linear infinite}
.refresh-time{font-size:11px;color:var(--subtle)}
.main{max-width:1160px;margin:0 auto;padding:2rem 1.5rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:2rem}
.kpi{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .2s}
.kpi:hover{box-shadow:var(--shadow-lg)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0}
.kpi-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);margin-bottom:8px}
.kpi-value{font-size:30px;font-weight:600;color:var(--text);line-height:1;margin-bottom:6px}
.kpi-detail{font-size:12px;color:var(--muted)}
.kpi-delta{font-size:12px;font-weight:600;margin-top:4px}
.delta-bad{color:var(--red)}.delta-good{color:var(--green)}
.alert{border-radius:14px;padding:16px 20px;margin-bottom:2rem;border-left:4px solid;box-shadow:var(--shadow)}
.alert-warn{background:#fffbeb;border-color:var(--amber)}
.alert-success{background:#f0fdf7;border-color:var(--green)}
.alert-danger{background:#fff5f5;border-color:var(--red)}
.alert-title{font-size:13px;font-weight:700;margin-bottom:4px}
.alert-body{font-size:13px;color:var(--muted);line-height:1.5}
.card{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);margin-bottom:16px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.ld{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:740px){.grid2{grid-template-columns:1fr}}
.sem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sem-item{background:var(--surface2);border-radius:12px;border:1px solid var(--border);padding:14px;position:relative;overflow:hidden}
.sem-item::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.sem-red::after{background:var(--red)}.sem-amber::after{background:var(--amber)}.sem-green::after{background:var(--green)}
.sem-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:8px;letter-spacing:.04em}
.badge-red{background:#fff0f0;color:var(--red)}.badge-amber{background:#fff8e1;color:#b37300}.badge-green{background:#edfaf4;color:#0d7a55}
.sem-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.sem-sku{font-size:10px;color:var(--subtle);margin-bottom:2px}
.sem-cat{font-size:10px;color:var(--subtle);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.sem-num{font-size:26px;font-weight:700;color:var(--text);line-height:1;margin-bottom:2px}
.sem-sub{font-size:11px;color:var(--muted)}
.sem-vp{font-size:11px;font-weight:700;color:var(--text);margin-top:4px}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="app-logo">Seguimiento de Inventario · Sánchez</div>
  <div class="loading-card">
    <div class="loading-icon" id="loading-icon">📊</div>
    <h1 id="loading-title">Cargando datos…</h1>
    <p id="loading-msg">Conectando con Google Sheets</p>
    <div class="spinner" id="spinner"></div>
    <div class="error-box" id="error-box"></div>
    <button class="btn-retry" id="btn-retry" style="display:none" onclick="loadData()">🔄 Reintentar</button>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <span class="topbar-brand">Inventario · Venta Perdida</span>
    <div class="topbar-right">
      <span class="refresh-time" id="refresh-time"></span>
      <span class="topbar-corte" id="corte-label"></span>
      <button class="btn-refresh" id="btn-refresh" onclick="loadData(true)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
        Actualizar
      </button>
    </div>
  </div>
  <div class="main">
    <div class="kpi-grid" id="kpis"></div>
    <div id="alerta-box"></div>
    <div class="card">
      <div class="card-title">Venta perdida por categoría — acumulado semanal</div>
      <div class="legend" id="leg-stacked"></div>
      <div style="position:relative;height:400px"><canvas id="cStacked"></canvas></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">Venta perdida total — comportamiento semanal</div>
        <div style="position:relative;height:300px"><canvas id="cTotal"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Top 10 — mayor venta perdida (último corte)</div>
        <div style="position:relative;height:300px"><canvas id="cRank"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Top 10 — tiendas con más quiebres (último corte)</div>
      <div class="sem-grid" id="sem"></div>
    </div>
  </div>
</div>

<script>
Chart.register(ChartDataLabels);

const API_KEY  = 'AIzaSyBI9DY3nfY10KXB9bHrJFqo3kf3VZkVYHQ';
const SHEET_ID = '1gRbfdRnC2XqMTGPaIJSGZPGSqbVFmFdlpmggNPQM96I';
const SHEET_TAB = 'DATOS';

const CAT_CONFIG = {
  'Crema dental': '#2a78d6',
  'Limpiadores':  '#1baf7a',
  'Jabones':      '#eda100',
  'Cepillos':     '#534AB7',
  'Desodorantes': '#e24b4a',
  'Lava trastes': '#0D7A55',
  'Suavizantes':  '#7A5200',
  'Shampoo':      '#1565C0',
};
const CAT_ORDER = Object.keys(CAT_CONFIG);
let charts = {};

function fmtK(v){
  if(v==null||v===0||isNaN(v)) return '';
  if(Math.abs(v)>=1e6) return '$'+(v/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(Math.abs(v)>=1000) return '$'+(v/1000).toFixed(1).replace(/\.0$/,'')+'K';
  return '$'+Math.round(v);
}
function fmtFull(v){ return '$'+Math.round(v||0).toLocaleString('es-MX') }
function safeFloat(s){
  try{ return parseFloat(String(s||'').replace(/[$,\s]/g,'').trim())||0 }catch{return 0}
}

async function loadData(isRefresh=false){
  const btn=document.getElementById('btn-refresh');
  if(btn){btn.disabled=true;btn.classList.add('loading')}
  if(!isRefresh){
    document.getElementById('loading-screen').style.display='flex';
    document.getElementById('dashboard').style.display='none';
    document.getElementById('spinner').style.display='block';
    document.getElementById('error-box').style.display='none';
    document.getElementById('btn-retry').style.display='none';
    document.getElementById('loading-title').textContent='Cargando datos…';
    document.getElementById('loading-msg').textContent='Conectando con Google Sheets';
  }
  try{
    const range=encodeURIComponent(`${SHEET_TAB}!A1:ZZ500`);
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}`;
    const resp=await fetch(url);
    if(!resp.ok){ const e=await resp.json(); throw new Error(e.error?.message||`Error ${resp.status}`); }
    const json=await resp.json();
    const rows=json.values||[];
    if(!rows.length) throw new Error('El Sheets está vacío o la pestaña DATOS no existe.');
    const data=processRows(rows);
    renderDashboard(data);
    const now=new Date();
    const t=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    const d=now.toLocaleDateString('es-MX',{day:'2-digit',month:'short'});
    const rt=document.getElementById('refresh-time');
    if(rt){rt.textContent=`Actualizado ${d} ${t}`;rt.style.color=''}
  }catch(err){
    console.error(err);
    if(isRefresh){
      const rt=document.getElementById('refresh-time');
      if(rt){rt.textContent='⚠️ Error al actualizar';rt.style.color='var(--red)'}
    }else{
      document.getElementById('spinner').style.display='none';
      document.getElementById('loading-icon').textContent='⚠️';
      document.getElementById('loading-title').textContent='No se pudo conectar';
      document.getElementById('loading-msg').textContent='Verifica que el Sheets esté compartido como "Cualquiera con el enlace".';
      const eb=document.getElementById('error-box');
      eb.textContent='Detalle: '+err.message;
      eb.style.display='block';
      document.getElementById('btn-retry').style.display='inline-block';
    }
  }finally{
    if(btn){btn.disabled=false;btn.classList.remove('loading')}
  }
}

function processRows(rows){
  // ── Detectar fila de encabezado ──
  let headerRow=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){
    if(rows[i].some(c=>String(c||'').toUpperCase().includes('CATEGOR'))){
      headerRow=i; break;
    }
  }
  if(headerRow<0) throw new Error('No se encontró encabezado con CATEGORÍA.');

  const header=rows[headerRow];

  // ── Detectar columnas fijas por nombre ──
  // Buscamos dinámicamente las columnas por su encabezado
  let colCat=-1, colSku=-1, colProd=-1, colAvg=-1, colPrecio=-1;
  for(let c=0;c<header.length;c++){
    const h=String(header[c]||'').toUpperCase().trim();
    if(h.includes('CATEGOR') && colCat<0)   colCat=c;
    else if(h.includes('SKU') && colSku<0)  colSku=c;
    else if(h.includes('PRODUCT') && colProd<0) colProd=c;
    else if((h.includes('AVG')||h.includes('SO')) && colAvg<0) colAvg=c;
    else if(h.includes('PRECIO') && colPrecio<0) colPrecio=c;
  }

  // Fallback: si no se detectan por nombre, usar posiciones por defecto
  // Estructura con SKU: B=cat(1), C=sku(2), D=prod(3), E=avg(4), F=precio(5)
  if(colCat<0)   colCat=1;
  if(colSku<0)   colSku=2;
  if(colProd<0)  colProd=3;
  if(colAvg<0)   colAvg=4;
  if(colPrecio<0) colPrecio=5;

  // ── Columnas de fecha: todo lo que está después de colPrecio ──
  const fechasCols=[];
  for(let c=colPrecio+1;c<header.length;c++){
    const v=String(header[c]||'').trim();
    if(v) fechasCols.push({idx:c,label:v});
  }
  if(!fechasCols.length) throw new Error('No hay fechas. Agrega columnas de fecha después de PRECIO PZ.');

  const fechas=fechasCols.map(f=>f.label);

  // ── Leer productos ──
  const productos=[];
  for(let i=headerRow+1;i<rows.length;i++){
    const r=rows[i]||[];
    const cat=String(r[colCat]||'').trim();
    const sku=String(r[colSku]||'').trim();
    const prod=String(r[colProd]||'').trim();
    const avg=safeFloat(r[colAvg]);
    const precio=safeFloat(r[colPrecio]);
    if(!cat||!prod||!CAT_CONFIG[cat]) continue;
    const tiendas=fechasCols.map(f=>safeFloat(r[f.idx])||0);
    productos.push({cat,sku,prod,avg,precio,tiendas});
  }
  if(!productos.length) throw new Error('No se encontraron productos válidos.');

  // ── Totales por categoría ──
  const totalesCat={};
  CAT_ORDER.forEach(cat=>{totalesCat[cat]=fechas.map(()=>0)});
  productos.forEach(p=>{
    if(!totalesCat[p.cat]) return;
    p.tiendas.forEach((t,fi)=>{
      // Filtrar anomalías (tiendas > 500 = error de captura)
      if(t>0&&t<500) totalesCat[p.cat][fi]+=Math.round(t*p.avg*p.precio);
    });
  });

  const totalGeneral=fechas.map((_,fi)=>
    CAT_ORDER.reduce((s,cat)=>s+(totalesCat[cat]?.[fi]||0),0)
  );

  // ── Último corte ──
  const fi=fechas.length-1;
  const prodsLast=productos.map(p=>({
    n:p.prod, sku:p.sku, cat:p.cat,
    t: p.tiendas[fi]<500 ? p.tiendas[fi] : 0,
    vp: p.tiendas[fi]<500 ? Math.round(p.tiendas[fi]*p.avg*p.precio) : 0,
    c: CAT_CONFIG[p.cat]||'#888'
  })).filter(p=>p.t>0);

  // ── Proyección: VP del último corte × días del mes ──
  const lastLabel=fechas[fi];
  const diasMes=31;
  const diasTranscurridos=14; // para mostrar en el detalle del KPI
  // La VP del corte ya representa un día → multiplicar directo por días del mes
  const vpUltimoCorte=totalGeneral[fi]||0;
  const proyeccion=Math.round(vpUltimoCorte*diasMes);

  return{fechas,totalesCat,totalGeneral,prodsLast,proyeccion,diasTranscurridos,diasMes,lastLabel};
}

function renderDashboard(data){
  const{fechas,totalesCat,totalGeneral,prodsLast,proyeccion,diasTranscurridos,diasMes,lastLabel}=data;
  const fi=totalGeneral.length-1, fp=fi-1;
  const tLast=totalGeneral[fi]||0, tPrev=totalGeneral[fp]||0;
  const dpct=tPrev>0?Math.round((tLast-tPrev)/tPrev*100):0;

  const maxT=prodsLast.filter(p=>p.t<500).reduce((m,p)=>p.t>m.t?p:m,{t:0,n:'—',sku:'',cat:''});
  const top10vp=[...prodsLast].sort((a,b)=>b.vp-a.vp).slice(0,10);
  const top10t=[...prodsLast].sort((a,b)=>b.t-a.t).slice(0,10);
  const critico=top10vp[0]||{n:'—',sku:'',vp:0};

  document.getElementById('corte-label').innerHTML=`Corte: <span>${lastLabel}</span>`;

  // ── KPIs ──
  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="kpi-accent" style="background:var(--red)"></div>
      <div class="kpi-label">Venta perdida total</div>
      <div class="kpi-value">${fmtK(tLast)}</div>
      <div class="kpi-delta ${dpct>0?'delta-bad':'delta-good'}">${dpct>=0?'▲':'▼'} ${Math.abs(dpct)}% vs semana anterior</div>
    </div>
    <div class="kpi"><div class="kpi-accent" style="background:var(--blue)"></div>
      <div class="kpi-label">Máx. tiendas en cero</div>
      <div class="kpi-value">${maxT.t}</div>
      <div class="kpi-detail">${maxT.n}${maxT.sku?' ('+maxT.sku+')':''} — ${maxT.cat}</div>
    </div>
    <div class="kpi"><div class="kpi-accent" style="background:var(--amber)"></div>
      <div class="kpi-label">Producto crítico</div>
      <div class="kpi-value" style="font-size:18px;margin-top:4px">${critico.n}${critico.sku?' ('+critico.sku+')':''}</div>
      <div class="kpi-delta delta-bad">${fmtFull(critico.vp)} perdidos</div>
    </div>
    <div class="kpi"><div class="kpi-accent" style="background:var(--purple)"></div>
      <div class="kpi-label">Proyección del mes</div>
      <div class="kpi-value">${fmtK(proyeccion)}</div>
      <div class="kpi-detail">VP corte × ${diasMes} días del mes</div>
    </div>`;

  // ── Alerta ──
  let cls='alert-warn',titulo='Alerta de la semana',cuerpo='';
  if(dpct<=-30){cls='alert-success';titulo='🟢 Mejora significativa esta semana';
    cuerpo=`La venta perdida bajó ${Math.abs(dpct)}% vs semana anterior. <strong>${critico.n}</strong> sigue siendo el mayor impacto (${fmtFull(critico.vp)}). Proyección del mes: ${fmtK(proyeccion)}.`;
  }else if(dpct<0){cls='alert-success';titulo='✅ Tendencia positiva esta semana';
    cuerpo=`La venta perdida bajó ${Math.abs(dpct)}%. <strong>${critico.n}</strong> con ${fmtFull(critico.vp)} de venta perdida. Proyección del mes: ${fmtK(proyeccion)}.`;
  }else{
    cuerpo=`<strong>${critico.n}</strong> genera la mayor venta perdida: ${fmtFull(critico.vp)}. <strong>${maxT.n}</strong> tiene más tiendas en cero (${maxT.t}). Proyección del mes: ${fmtK(proyeccion)}.`;
  }
  document.getElementById('alerta-box').innerHTML=`<div class="alert ${cls}"><div class="alert-title">${titulo}</div><div class="alert-body">${cuerpo}</div></div>`;

  const gc='#e8e7e1',tc='#898781',lc='#52514e';
  const catsConDatos=CAT_ORDER.filter(cat=>totalesCat[cat]?.some(v=>v>0));

  document.getElementById('leg-stacked').innerHTML=catsConDatos.map(cat=>
    `<span><span class="ld" style="background:${CAT_CONFIG[cat]}"></span>${cat}</span>`
  ).join('');

  // Plugin total encima barras
  const totalLabelPlugin={
    id:'totalLabel',
    afterDraw(chart){
      const{ctx,scales:{x,y}}=chart;
      ctx.save();
      totalGeneral.forEach((t,i)=>{
        if(!t) return;
        const xPos=x.getPixelForValue(i),yPos=y.getPixelForValue(t);
        const label=fmtK(t);
        ctx.font='bold 11px sans-serif';
        const w=ctx.measureText(label).width+10;
        ctx.fillStyle='rgba(255,255,255,0.92)';
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(xPos-w/2,yPos-20,w,16,3);
        else ctx.rect(xPos-w/2,yPos-20,w,16);
        ctx.fill();
        ctx.fillStyle='#1a1a19';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(label,xPos,yPos-12);
      });
      ctx.restore();
    }
  };

  // Barras apiladas
  if(charts.stacked) charts.stacked.destroy();
  charts.stacked=new Chart(document.getElementById('cStacked'),{
    type:'bar',
    data:{labels:fechas,datasets:catsConDatos.map((cat,ci)=>({
      label:cat,data:totalesCat[cat],
      backgroundColor:CAT_CONFIG[cat],
      borderRadius:ci===catsConDatos.length-1?{topLeft:6,topRight:6}:0,
      borderSkipped:false,
      datalabels:{color:'#fff',anchor:'center',align:'center',
        font:{size:10,weight:'700'},formatter:v=>v>=2000?fmtK(v):''}
    }))},
    options:{
      responsive:true,maintainAspectRatio:false,layout:{padding:{top:30}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>`  ${c.dataset.label}: ${fmtK(c.raw)||'$0'}`,
          footer:items=>`  Total: ${fmtK(totalGeneral[items[0].dataIndex])}`}},
        datalabels:{display:true}},
      scales:{
        x:{stacked:true,ticks:{color:tc,font:{size:9},autoSkip:false,maxRotation:45},grid:{display:false}},
        y:{stacked:true,ticks:{color:tc,font:{size:11},callback:v=>fmtK(v)},grid:{color:gc}}
      }
    },
    plugins:[totalLabelPlugin]
  });

  // Línea total
  if(charts.total) charts.total.destroy();
  charts.total=new Chart(document.getElementById('cTotal'),{
    type:'line',
    data:{labels:fechas,datasets:[{label:'Total',data:totalGeneral,
      borderColor:'#534AB7',pointBackgroundColor:'#534AB7',
      backgroundColor:'#534AB720',borderWidth:3,pointRadius:5,tension:0.35,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:44,right:12}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>` Total: ${fmtK(c.raw)}`}},
        datalabels:{display:true,anchor:'end',align:'top',offset:5,clip:false,
          font:{size:11,weight:'700'},color:'#534AB7',
          backgroundColor:'rgba(255,255,255,0.92)',
          borderRadius:5,padding:{top:2,bottom:2,left:5,right:5},
          formatter:v=>fmtK(v)}},
      scales:{
        x:{ticks:{color:tc,font:{size:9},autoSkip:false,maxRotation:45},grid:{color:gc}},
        y:{ticks:{color:tc,font:{size:11},callback:v=>fmtK(v)},grid:{color:gc}}
      }}
  });

  // Ranking
  if(charts.rank) charts.rank.destroy();
  charts.rank=new Chart(document.getElementById('cRank'),{
    type:'bar',
    data:{labels:top10vp.map(p=>p.n),
      datasets:[{data:top10vp.map(p=>p.vp),backgroundColor:top10vp.map(p=>p.c),borderRadius:6,label:'VP'}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:70}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>` ${fmtFull(c.raw)}`}},
        datalabels:{anchor:'end',align:'end',offset:5,clip:false,
          font:{size:11,weight:'600'},color:lc,formatter:v=>fmtK(v)}},
      scales:{
        x:{ticks:{color:tc,font:{size:10},callback:v=>fmtK(v)},grid:{color:gc}},
        y:{ticks:{color:tc,font:{size:11}},grid:{display:false}}
      }}
  });

  // Semáforo
  const sem=document.getElementById('sem');
  sem.innerHTML='';
  top10t.forEach(p=>{
    const cls=p.t>60?'red':p.t>30?'amber':'green';
    const badge=cls==='red'?'CRÍTICO':cls==='amber'?'ALERTA':'CONTROLADO';
    sem.innerHTML+=`<div class="sem-item sem-${cls}">
      <span class="sem-badge badge-${cls}">${badge}</span>
      <div class="sem-name">${p.n}</div>
      ${p.sku?`<div class="sem-sku">SKU ${p.sku}</div>`:''}
      <div class="sem-cat">${p.cat}</div>
      <div class="sem-num">${p.t}</div>
      <div class="sem-sub">tiendas en cero</div>
      <div class="sem-vp">${fmtK(p.vp)} perdidos</div>
    </div>`;
  });

  document.getElementById('loading-screen').style.display='none';
  document.getElementById('dashboard').style.display='block';
}

loadData();
</script>
</body>
</html>
